name: Component_Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  Application-Build:
    runs-on: ubuntu-24.04
    steps:
    -  uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    - name: build_application_message
      run: echo "Building application..."
    -  name: build_frontend
       run: go build
       working-directory: frontend
    -  name: build_backend
       run: go build
       working-directory: frontend
#--------------------------------- TESTING--------------------------------------  
  Unitest-Frontend-Code:
    runs-on: ubuntu-24.04
    needs: Application-Build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: frontend_test_message
        run: echo "Running frontend test..."
      - name: run frontend test
        run: go test
        working-directory: frontend
  Unitest-Backend-Code:
    runs-on: ubuntu-24.04
    needs: Application-Build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: backend_test_message
        run: echo "Running backend test..."
      - name: backend test
        run: go test
        working-directory: backend

#----------------------------------DOCKER-------------------------------------- 
  Docker-Image-Frontend-Build-And-Push:
    runs-on: ubuntu-24.04
    needs: [Unitest-Frontend-Code, Unitest-Backend-Code]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: GitHub Container Registry Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker
        run: docker build -t ghcr.io/mihneatudor/frontend:${{ github.sha }} ./frontend
      - name: Push Docker
        run: docker push ghcr.io/mihneatudor/frontend:${{ github.sha }}
        
  Docker-Image-Backend-Build-And-Push:
    runs-on: ubuntu-24.04
    needs: [Unitest-Frontend-Code, Unitest-Backend-Code]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: GitHub Container Registry Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker
        run: docker build -t ghcr.io/mihneatudor/backend:${{ github.sha }} ./backend

      - name: Push Docker
        run: docker push ghcr.io/mihneatudor/backend:${{ github.sha }}
        
        
      
