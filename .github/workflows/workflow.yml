name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Application-Build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: build_application_message
        run: echo "Building application..."
      - name: build_frontend
        run: go build
        working-directory: frontend
      - name: build_backend
        run: go build
        working-directory: backend

#--------------------------------- TESTING--------------------------------------
  Unitest-Frontend-Code:
    runs-on: ubuntu-24.04
    needs: Application-Build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: frontend_test_message
        run: echo "Running frontend test..."
      - name: run frontend test
        run: go test
        working-directory: frontend

  Unitest-Backend-Code:
    runs-on: ubuntu-24.04
    needs: Application-Build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: backend_test_message
        run: echo "Running backend test..."
      - name: backend test
        run: go test
        working-directory: backend

#----------------------------------DOCKER--------------------------------------
  Docker-Image-Frontend-Build-And-Push:
    runs-on: ubuntu-24.04
    needs: [Unitest-Frontend-Code, Unitest-Backend-Code, Smoke-Test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: GitHub Container Registry Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker
        run: docker build -t ghcr.io/mihneatudor/frontend:${{ github.sha }} ./frontend
      - name: Push Docker
        run: docker push ghcr.io/mihneatudor/frontend:${{ github.sha }}

  Docker-Image-Backend-Build-And-Push:
    runs-on: ubuntu-24.04
    needs: [Unitest-Frontend-Code, Unitest-Backend-Code, Smoke-Test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: GitHub Container Registry Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker
        run: docker build -t ghcr.io/mihneatudor/backend:${{ github.sha }} ./backend
      - name: Push Docker
        run: docker push ghcr.io/mihneatudor/backend:${{ github.sha }}

#----------------------------------SMOKE TEST-----------------------------------
  Smoke-Test:
      runs-on: ubuntu-24.04
      needs: [Application-Build]
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
  
        - name: Build backend image
          run: docker build -t backend:test ./backend
  
        - name: Build frontend image
          run: docker build -t frontend:test ./frontend
  
        - name: Create test network
          run: docker network create smoke-test-net
  
        - name: Run backend container
          run: docker run -d --name backend --network smoke-test-net backend:test
  
        - name: Run frontend container
          run: docker run -d --name frontend --network smoke-test-net frontend:test
  
        - name: Run smoke tests
          run: |
            docker run --rm \
              --network smoke-test-net \
              curlimages/curl:latest \
              sh -c '
                echo "Checking backend healthz...";
                for i in $(seq 1 10); do
                  if curl -sf http://backend:9000/healthz | grep -q "OK"; then
                    echo "Backend healthy";
                    break;
                  fi;
                  if [ "$i" = "10" ]; then
                    echo "Backend healthz failed after retries";
                    exit 1;
                  fi;
                  sleep 3;
                done;

                echo "Checking frontend healthz...";
                for i in $(seq 1 10); do
                  if curl -sf http://frontend:8080/healthz | grep -q "OK"; then
                    echo "Frontend healthy";
                    break;
                  fi;
                  if [ "$i" = "10" ]; then
                    echo "Frontend healthz failed after retries";
                    exit 1;
                  fi;
                  sleep 3;
                done;
              '
  
        - name: Show logs on failure
          if: failure()
          run: |
            echo "---- backend logs ----"
            docker logs backend || true
            echo "---- frontend logs ----"
            docker logs frontend || true
  
        - name: Cleanup
          if: always()
          run: |
            docker rm -f backend frontend || true
            docker network rm smoke-test-net || true

#----------------------------------KUBERNETES-------------------------------------- 
  Deploy-To-Kubernetes:
    runs-on: ubuntu-24.04
    needs: [ Docker-Image-Frontend-Build-And-Push , Docker-Image-Backend-Build-And-Push]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      - name: Restore kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Test cluster connection
        run: kubectl get nodes
      - name: Deploy manifests
        run: kubectl apply -f deployment/
        
        
      
