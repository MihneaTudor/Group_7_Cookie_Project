apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/mihneatudor/backend:a17ed596587fe56efda948a51059c2286b565914
          env:
          - name: REDIS_DNS
            value: "redisdb"
          - name: REDIS_PORT
            value: "5000"